name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Kiểm tra kiểu dữ liệu và hồi quy lập lá số
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Repo có package-lock.json: cài theo phiên bản đã khóa và bật cache npm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cài đặt dependencies
        run: npm ci --no-audit --no-fund

      - name: Kiểm tra TypeScript
        run: npm run typecheck

      - name: Kiểm thử hồi quy bộ máy an sao
        run: npm test

      - name: Kiểm tra Next.js production build
        run: npm run build
