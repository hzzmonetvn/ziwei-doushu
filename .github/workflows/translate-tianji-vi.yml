name: "Việt hóa 1.848 trích đoạn Thiên Kỷ"

on:
  push:
    branches:
      - localization/vi-VN
    paths:
      - .github/workflows/translate-tianji-vi.yml
      - scripts/translate_tianji_vi.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-tianji-vi
  cancel-in-progress: false

jobs:
  translate:
    name: "Dịch, đối chiếu và tạo tệp song ngữ"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: localization/vi-VN
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Dịch toàn bộ corpus tiếng Trung sang tiếng Việt"
        run: python3 scripts/translate_tianji_vi.py
      - name: "Xác minh số lượng và nguyên văn nguồn"
        run: python3 scripts/translate_tianji_vi.py --check
      - name: "Commit bản dịch song ngữ"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tianji-ziwei/entries.vi.jsonl docs/tianji-ziwei/translation-report.vi.json docs/tianji-ziwei/vi/
          if git diff --cached --quiet; then
            echo "No new translated content"
          else
            git commit -m "docs(vi): publish bilingual translations for all 1848 Tian Ji excerpts"
            # Main branch may have advanced while the translation job was running.
            # Rebase the generated documentation on the latest localization branch.
            git fetch origin localization/vi-VN
            git rebase origin/localization/vi-VN
            git push origin HEAD:localization/vi-VN
          fi
