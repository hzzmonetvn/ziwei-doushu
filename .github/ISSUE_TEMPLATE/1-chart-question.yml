name: Thắc mắc kết quả lập lá số
description: Khi nghi ngờ một lá số được an sai, hãy cung cấp dữ liệu sinh và kết quả đối chiếu để kiểm tra.
title: "[Thắc mắc lá số] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Cần cung cấp đầy đủ thông tin để có thể kiểm tra lá số.
        Độ sáng phụ tinh, quy tắc tháng nhuận và đổi ngày giờ Tý muộn có thể khác nhau giữa các trường phái.
        Không công khai dữ liệu sinh của người khác khi chưa được phép.
  - type: input
    id: date
    attributes:
      label: Ngày sinh dương lịch
      placeholder: "Ví dụ: 1990-05-12"
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Giờ sinh (giờ và phút)
      placeholder: "Ví dụ: 08:30"
    validations:
      required: true
  - type: input
    id: place
    attributes:
      label: Nơi sinh hoặc kinh độ
      description: Dùng để hiệu chỉnh giờ mặt trời thực; chênh lệch kinh độ có thể làm thay đổi giờ địa chi.
      placeholder: "Ví dụ: Hà Nội / kinh độ 105,8° Đông"
  - type: dropdown
    id: gender
    attributes:
      label: Giới tính
      options: ["Nam", "Nữ"]
    validations:
      required: true
  - type: textarea
    id: ours
    attributes:
      label: Kết quả của dự án này
      description: Đính kèm ảnh chụp hoặc các trường tương ứng trong kết quả generateChart.
    validations:
      required: true
  - type: input
    id: ref
    attributes:
      label: Nguồn dùng để đối chiếu
      placeholder: "Ví dụ: phần mềm an sao khác / sách và số trang"
    validations:
      required: true
  - type: textarea
    id: theirs
    attributes:
      label: Kết quả đối chiếu
      description: Ảnh chụp hoặc văn bản.
    validations:
      required: true
  - type: textarea
    id: diff
    attributes:
      label: Chi tiết khác biệt
      placeholder: "Ví dụ: cung Mệnh dự kiến ở Mão, nhưng kết quả lại ở Tuất"
    validations:
      required: true
