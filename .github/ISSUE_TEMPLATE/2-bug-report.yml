name: Báo lỗi chương trình
description: Lỗi cài đặt, chạy mã, giao diện hoặc kết quả bất thường.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Bản mã nguồn mở không chứa backend /api/* cho AI luận giải và ghép lá số.
        Phản hồi 404 ở những chức năng này là đúng thiết kế; cần tự triển khai backend.
        Tính năng lập lá số không cần API Key.
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      placeholder: |
        1. npm ci
        2. npm run dev
        3. Mở /chart, thực hiện các thao tác...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế (thông báo lỗi, ảnh chụp)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Môi trường chạy
      placeholder: "Ví dụ: macOS 15 / Node.js 22 / Chrome 140"
