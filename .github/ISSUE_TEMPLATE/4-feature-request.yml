name: Đề xuất tính năng
description: Đề xuất chức năng mới hoặc cải tiến.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Vấn đề cần giải quyết
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Giải pháp bạn đề xuất
  - type: textarea
    id: source
    attributes:
      label: Dẫn chứng (nếu liên quan quy tắc Tử Vi)
      description: "Nêu tên sách, bài giảng hoặc phần mềm đối chiếu. Thay đổi quy tắc an sao không có nguồn thường không được chấp nhận."
