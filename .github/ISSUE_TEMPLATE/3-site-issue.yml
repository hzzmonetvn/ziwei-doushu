name: Vấn đề trên website OURANIC
description: Các vấn đề đăng nhập, thanh toán, hiển thị trên ouranic.cn.
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: URL trang gặp lỗi
      placeholder: "https://ouranic.cn/..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước dẫn đến lỗi
      placeholder: "Bạn đã nhấp gì, điền gì và nhận thông báo nào?"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Trình duyệt và hệ điều hành
      placeholder: "Ví dụ: Windows 11 / Chrome 153 / có sử dụng proxy"
  - type: textarea
    id: screenshot
    attributes:
      label: Ảnh chụp
      description: "Không đăng số điện thoại, mã OTP hoặc thông tin sinh của người khác."
